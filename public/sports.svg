<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -8 28 16" width="280" height="160">
  <!-- Sports Car: Crimson Red Supercar with Hood Vents and Sleek Aerodynamics -->
  <defs>
    <filter id="sportsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 4 Rubber Tires -->
  <rect x="5.5" y="-7.4" width="4.8" height="2" rx="0.8" fill="#090d16" />
  <rect x="5.5" y="5.4" width="4.8" height="2" rx="0.8" fill="#090d16" />
  <rect x="-9.2" y="-7.4" width="4.8" height="2" rx="0.8" fill="#090d16" />
  <rect x="-9.2" y="5.4" width="4.8" height="2" rx="0.8" fill="#090d16" />

  <!-- Outer Dark Chassis Rim -->
  <path
    d="M -11.5 -6 C -13.2 -6 -13.8 -4.8 -13.8 -2.5 L -13.8 2.5 C -13.8 4.8 -13.2 6 -11.5 6 L 9.5 6 C 11.8 6 13.2 4.2 13.6 1.8 L 13.6 -1.8 C 13.2 -4.2 11.8 -6 9.5 -6 Z"
    fill="#1a0505"
  />

  <!-- Main Crimson Red Body Shell -->
  <path
    d="M -11 -5.4 C -12.5 -5.4 -12.8 -4.2 -12.8 -2.2 L -12.8 2.2 C -12.8 4.2 -12.5 5.4 -11 5.4 L 9 5.4 C 11.2 5.4 12.5 3.8 12.8 1.5 L 12.8 -1.5 C 12.5 -3.8 11.2 -5.4 9 -5.4 Z"
    fill="#dc2626"
  />

  <!-- Side Aerodynamic Skirts / Contours -->
  <rect x="-10" y="-5.4" width="18" height="0.7" fill="#b91c1c" />
  <rect x="-10" y="4.7" width="18" height="0.7" fill="#b91c1c" />

  <!-- Front Wedge Nose & Headlights (Crisp White/Amber) -->
  <polygon points="10,-5 12.4,-3.8 11.6,-1.8 9.2,-2.6" fill="#ffffff" stroke="#fca5a5" stroke-width="0.3" />
  <polygon points="10,5 12.4,3.8 11.6,1.8 9.2,2.6" fill="#ffffff" stroke="#fca5a5" stroke-width="0.3" />

  <!-- Rear Taillights -->
  <rect x="-12.8" y="-5" width="1.6" height="2" rx="0.4" fill="#991b1b" />
  <rect x="-12.8" y="3" width="1.6" height="2" rx="0.4" fill="#991b1b" />

  <!-- Hood Cooling Vents / Induction Slits -->
  <path d="M 6 -3.2 L 10 -2.2 L 10 2.2 L 6 3.2 Z" fill="#ef4444" opacity="0.65" />
  <rect x="7" y="-2" width="2.2" height="4" rx="0.5" fill="#450a0a" opacity="0.75" />
  <line x1="7.6" y1="-1.6" x2="7.6" y2="1.6" stroke="#991b1b" stroke-width="0.4" />
  <line x1="8.4" y1="-1.6" x2="8.4" y2="1.6" stroke="#991b1b" stroke-width="0.4" />

  <!-- Sleek Windshield & Glasshouse Canopy -->
  <path
    d="M -7 -4.4 L 4.8 -4.4 C 5.8 -4.4 6.5 -3 6.8 0 C 6.5 3 5.8 4.4 4.8 4.4 L -7 4.4 C -8 4.4 -8.5 3 -8.8 0 C -8.5 -3 -8 -4.4 -7 -4.4 Z"
    fill="#18181b"
  />

  <!-- Front Windshield Glass Tint -->
  <path
    d="M 3.8 -3.8 L 4.8 -3.8 C 5.8 -3 6.2 -1.2 6.2 0 C 6.2 1.2 5.8 3 4.8 3.8 L 3.8 3.8 C 4.5 2.2 4.8 0 4.8 0 C 4.8 0 4.5 -2.2 3.8 -3.8 Z"
    fill="#fecaca"
    opacity="0.85"
  />

  <!-- Center Roof Panel -->
  <rect x="-3" y="-3.4" width="6" height="6.8" rx="0.8" fill="#ef4444" stroke="#b91c1c" stroke-width="0.5" />
  <line x1="-2" y1="0" x2="2" y2="0" stroke="#fca5a5" stroke-width="0.6" opacity="0.6" />

  <!-- Rear Engine Bay Louvers -->
  <rect x="-8.2" y="-3.2" width="4.4" height="6.4" rx="0.6" fill="#18181b" />
  <line x1="-7.6" y1="-2.4" x2="-7.6" y2="2.4" stroke="#450a0a" stroke-width="0.5" />
  <line x1="-6.4" y1="-2.4" x2="-6.4" y2="2.4" stroke="#450a0a" stroke-width="0.5" />
  <line x1="-5.2" y1="-2.4" x2="-5.2" y2="2.4" stroke="#450a0a" stroke-width="0.5" />

  <!-- Rear Diffuser / Integrated Spoiler -->
  <rect x="-11.2" y="-4.4" width="1.4" height="8.8" rx="0.6" fill="#7f1d1d" />
</svg>
