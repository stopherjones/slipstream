<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -8 28 16" width="280" height="160">
  <!-- Tourer: British Racing Green GT Touring Car with White Roof & Pinstripes -->
  <defs>
    <filter id="tourerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 4 Rubber Tires -->
  <rect x="5.6" y="-7.2" width="4.8" height="1.8" rx="0.7" fill="#090d16" />
  <rect x="5.6" y="5.4" width="4.8" height="1.8" rx="0.7" fill="#090d16" />
  <rect x="-9.2" y="-7.2" width="4.8" height="1.8" rx="0.7" fill="#090d16" />
  <rect x="-9.2" y="5.4" width="4.8" height="1.8" rx="0.7" fill="#090d16" />

  <!-- Outer Dark Chassis Rim -->
  <path
    d="M -12 -5.8 C -13.5 -5.8 -14 -4.5 -14 -2.5 L -14 2.5 C -14 4.5 -13.5 5.8 -12 5.8 L 9.8 5.8 C 12 5.8 13.2 4.2 13.6 1.8 L 13.6 -1.8 C 13.2 -4.2 12 -5.8 9.8 -5.8 Z"
    fill="#052e16"
  />

  <!-- Main British Racing Green Body Shell -->
  <path
    d="M -11.5 -5.2 C -12.8 -5.2 -13.2 -4 -13.2 -2.2 L -13.2 2.2 C -13.2 4 -12.8 5.2 -11.5 5.2 L 9.2 5.2 C 11.4 5.2 12.4 3.8 12.8 1.5 L 12.8 -1.5 C 12.4 -3.8 11.4 -5.2 9.2 -5.2 Z"
    fill="#15803d"
  />

  <!-- White Touring Side Pinstripes -->
  <rect x="-10.5" y="-5.2" width="18" height="0.6" fill="#f8fafc" />
  <rect x="-10.5" y="4.6" width="18" height="0.6" fill="#f8fafc" />

  <!-- Front Headlights (Cream / Xenon White) -->
  <polygon points="10.2,-4.8 12.4,-3.6 11.6,-1.8 9.4,-2.4" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.3" />
  <polygon points="10.2,4.8 12.4,3.6 11.6,1.8 9.4,2.4" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.3" />

  <!-- Rear Taillights (Ruby Red) -->
  <rect x="-13" y="-4.8" width="1.4" height="1.8" rx="0.3" fill="#dc2626" />
  <rect x="-13" y="3" width="1.4" height="1.8" rx="0.3" fill="#dc2626" />

  <!-- Hood Detail & Center Bulge -->
  <path d="M 5 -3.2 L 10.5 -2.2 L 10.5 2.2 L 5 3.2 Z" fill="#166534" opacity="0.7" />
  <line x1="5.5" y1="0" x2="11" y2="0" stroke="#f8fafc" stroke-width="0.5" opacity="0.8" />

  <!-- Cabin Glasshouse Frame -->
  <path
    d="M -8 -4.6 L 4.5 -4.6 C 5.5 -4.6 6.4 -3.2 6.8 0 C 6.4 3.2 5.5 4.6 4.5 4.6 L -8 4.6 C -9 4.6 -9.6 3.2 -9.8 0 C -9.6 -3.2 -9 -4.6 -8 -4.6 Z"
    fill="#052e16"
  />

  <!-- Front Windshield Glass -->
  <path
    d="M 3.2 -4 L 4.6 -4 C 5.6 -3.2 6 -1.2 6 0 C 6 1.2 5.6 3.2 4.6 4 L 3.2 4 C 4 2.4 4.4 0 4.4 0 C 4.4 0 4 -2.4 3.2 -4 Z"
    fill="#bae6fd"
    opacity="0.9"
  />

  <!-- White Touring Roof Panel -->
  <rect x="-4.5" y="-3.6" width="7.2" height="7.2" rx="0.8" fill="#f8fafc" stroke="#166534" stroke-width="0.5" />
  <rect x="-3.5" y="-2.6" width="5.2" height="5.2" rx="0.5" fill="#f1f5f9" />
  <line x1="-3.5" y1="0" x2="1.7" y2="0" stroke="#15803d" stroke-width="0.6" />

  <!-- Rear Window Glass -->
  <path
    d="M -8.5 -3.8 L -5.5 -4.2 L -5.5 4.2 L -8.5 3.8 C -9.2 2.5 -9.4 0 -9.4 0 C -9.4 0 -9.2 -2.5 -8.5 -3.8 Z"
    fill="#7dd3fc"
    opacity="0.8"
  />

  <!-- Rear Tourer Boot Lip / Spoiler -->
  <rect x="-11.2" y="-4.2" width="1.2" height="8.4" rx="0.4" fill="#14532d" />
</svg>
