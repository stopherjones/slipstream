<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -7.5 30 15" width="300" height="150">
  <!-- Red Touring Saloon (Player 2 / Bot) -->
  <defs>
    <filter id="carShadowSaloon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Wheels -->
  <rect x="6.5" y="-7.2" width="5.2" height="1.8" rx="0.8" fill="#0f172a" />
  <rect x="6.5" y="5.4" width="5.2" height="1.8" rx="0.8" fill="#0f172a" />
  <rect x="-9.5" y="-7.2" width="5.2" height="1.8" rx="0.8" fill="#0f172a" />
  <rect x="-9.5" y="5.4" width="5.2" height="1.8" rx="0.8" fill="#0f172a" />

  <!-- Outer Shell Border -->
  <path d="M -13 -5.8 C -14.5 -5.8 -14.8 -4.5 -14.8 -2.5 L -14.8 2.5 C -14.8 4.5 -14.5 5.8 -13 5.8 L 10.5 5.8 C 12.8 5.8 14.2 4.2 14.8 2 L 14.8 -2 C 14.2 -4.2 12.8 -5.8 10.5 -5.8 Z" fill="#180404" />

  <!-- Body Shell -->
  <path d="M -12.5 -5.2 C -13.8 -5.2 -14 -4 -14 -2 L -14 2 C -14 4 -13.8 5.2 -12.5 5.2 L 10 5.2 C 12.2 5.2 13.5 3.8 14 1.8 L 14 -1.8 C 13.5 -3.8 12.2 -5.2 10 -5.2 Z" fill="#dc2626" />

  <!-- Side Shadow / Contours -->
  <rect x="-12" y="-5.2" width="22" height="0.8" fill="#b91c1c" />
  <rect x="-12" y="4.4" width="22" height="0.8" fill="#b91c1c" />

  <!-- Front Warm Amber Headlights -->
  <polygon points="11,-4.8 13.6,-3.6 13,-1.8 10.5,-2.6" fill="#fef08a" stroke="#ca8a04" stroke-width="0.3" />
  <polygon points="11,4.8 13.6,3.6 13,1.8 10.5,2.6" fill="#fef08a" stroke="#ca8a04" stroke-width="0.3" />

  <!-- Rear Taillights -->
  <rect x="-13.8" y="-4.8" width="1.6" height="1.8" rx="0.3" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.2" />
  <rect x="-13.8" y="3" width="1.6" height="1.8" rx="0.3" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.2" />

  <!-- Long Hood / Bonnet Center Crease -->
  <line x1="5.5" y1="0" x2="13" y2="0" stroke="#ef4444" stroke-width="0.7" />
  <polygon points="6,-3 12,-2 12,2 6,3" fill="#ef4444" opacity="0.4" />

  <!-- Cabin Glasshouse Surround -->
  <path d="M -8 -4.5 L 5.5 -4.5 C 6.5 -4.5 7.2 -3.2 7.6 0 C 7.2 3.2 6.5 4.5 5.5 4.5 L -8 4.5 C -9.2 4.5 -9.6 3.2 -9.8 0 C -9.6 -3.2 -9.2 -4.5 -8 -4.5 Z" fill="#180404" />

  <!-- Front Windshield -->
  <path d="M 4 -3.8 L 5.5 -3.8 C 6.6 -3 7 -1.2 7 0 C 7 1.2 6.6 3 5.5 3.8 L 4 3.8 C 4.8 2.2 5 0 5 0 C 5 0 4.8 -2.2 4 -3.8 Z" fill="#93c5fd" />
  <line x1="4.5" y1="-2.6" x2="6.2" y2="-0.8" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.8" />

  <!-- Red Saloon Roof Panel -->
  <rect x="-4.8" y="-3.4" width="8" height="6.8" rx="0.8" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.5" />
  <!-- Sunroof / Roof Ridge -->
  <rect x="-3.5" y="-2.2" width="5.5" height="4.4" rx="0.5" fill="#991b1b" />

  <!-- Rear Window Glass -->
  <path d="M -8.2 -3.6 L -5.5 -3.8 L -5.5 3.8 L -8.2 3.6 C -8.8 2.2 -9 0 -9 0 C -9 0 -8.8 -2.2 -8.2 -3.6 Z" fill="#7dd3fc" />

  <!-- Extended Rear Trunk / Boot Deck -->
  <rect x="-12.8" y="-3.8" width="3.8" height="7.6" rx="0.6" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.4" />
  <line x1="-12" y1="-3.2" x2="-12" y2="3.2" stroke="#dc2626" stroke-width="0.6" />
</svg>
