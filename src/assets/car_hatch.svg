<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -8 28 16" width="280" height="160">
  <!-- Blue Hatchback (Player 1) -->
  <defs>
    <filter id="carShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Wheels -->
  <rect x="5" y="-7.5" width="5" height="2" rx="0.8" fill="#0f172a" />
  <rect x="5" y="5.5" width="5" height="2" rx="0.8" fill="#0f172a" />
  <rect x="-8.5" y="-7.5" width="5" height="2" rx="0.8" fill="#0f172a" />
  <rect x="-8.5" y="5.5" width="5" height="2" rx="0.8" fill="#0f172a" />

  <!-- Main Chassis / Outer Border -->
  <path d="M -11 -6.2 C -13 -6.2 -13.5 -5 -13.5 -3 L -13.5 3 C -13.5 5 -13 6.2 -11 6.2 L 9 6.2 C 11.5 6.2 13 4.5 13.5 2 L 13.5 -2 C 13 -4.5 11.5 -6.2 9 -6.2 Z" fill="#0b1329" />

  <!-- Body Shell -->
  <path d="M -10.5 -5.5 C -12.2 -5.5 -12.5 -4.5 -12.5 -2.5 L -12.5 2.5 C -12.5 4.5 -12.2 5.5 -10.5 5.5 L 8.5 5.5 C 10.8 5.5 12.2 4 12.5 1.8 L 12.5 -1.8 C 12.2 -4 10.8 -5.5 8.5 -5.5 Z" fill="#2563eb" />

  <!-- Side Shadow / Aero Contours -->
  <rect x="-10" y="-5.5" width="18" height="0.8" fill="#1d4ed8" />
  <rect x="-10" y="4.7" width="18" height="0.8" fill="#1d4ed8" />

  <!-- Front Headlights -->
  <polygon points="10,-5.2 12.2,-4 11.5,-2 9,-3" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.3" />
  <polygon points="10,5.2 12.2,4 11.5,2 9,3" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.3" />

  <!-- Rear Taillights -->
  <rect x="-12.5" y="-5.2" width="1.8" height="2" rx="0.4" fill="#ef4444" />
  <rect x="-12.5" y="3.2" width="1.8" height="2" rx="0.4" fill="#ef4444" />

  <!-- Hood / Bonnet detail -->
  <path d="M 5 -3.5 L 10.5 -2.5 L 10.5 2.5 L 5 3.5 Z" fill="#3b82f6" opacity="0.6" />

  <!-- Cabin Glasshouse Frame -->
  <path d="M -8.5 -4.8 L 5 -4.8 C 6 -4.8 6.8 -3.5 7.2 0 C 6.8 3.5 6 4.8 5 4.8 L -8.5 4.8 C -9.5 4.8 -10 3.5 -10.2 0 C -10 -3.5 -9.5 -4.8 -8.5 -4.8 Z" fill="#0f172a" />

  <!-- Front Windshield -->
  <path d="M 3.8 -4.2 L 5.2 -4.2 C 6.2 -3.5 6.6 -1.5 6.6 0 C 6.6 1.5 6.2 3.5 5.2 4.2 L 3.8 4.2 C 4.5 2.5 4.8 0 4.8 0 C 4.8 0 4.5 -2.5 3.8 -4.2 Z" fill="#93c5fd" />
  <line x1="4.2" y1="-3" x2="5.8" y2="-1" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" opacity="0.8" />

  <!-- White Sunroof / Roof Panel -->
  <rect x="-4.5" y="-3.6" width="7.2" height="7.2" rx="1" fill="#f8fafc" stroke="#1d4ed8" stroke-width="0.6" />
  <rect x="-3.5" y="-2.6" width="5.2" height="5.2" rx="0.6" fill="#e2e8f0" />

  <!-- Rear Window Glass -->
  <path d="M -8.8 -3.8 L -6 -4.2 L -6 4.2 L -8.8 3.8 C -9.4 2.5 -9.6 0 -9.6 0 C -9.6 0 -9.4 -2.5 -8.8 -3.8 Z" fill="#7dd3fc" />

  <!-- Rear Spoiler / Lip -->
  <rect x="-10.5" y="-4.2" width="1.2" height="8.4" rx="0.5" fill="#1e40af" />
</svg>
